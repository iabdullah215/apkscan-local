[project]
name = "apkscan-local"
version = "0.1.0"
description = "Offline Android vulnerability triage with a fine-tuned, quantized small Qwen model"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
train = ["mlx-lm", "huggingface_hub[cli]"]
eval = ["matplotlib", "psutil"]
dev = ["pytest"]

[project.scripts]
apkscan-local = "apkscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apkscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
