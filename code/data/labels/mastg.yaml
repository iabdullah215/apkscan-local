# OWASP MASTG demos (CC-BY-SA-4.0), commit e8183038, demos/android. Training split.
# Each demo is its own "app" for splitting. Code is MASTG's jadx-reversed Java (MastgTest_reversed.java etc.).
# Manifest line numbers refer to the normalized manifest (apkscan.chunking.normalize_xml).
# Labels read from each file; MASTG output.txt/evaluation used as a cross-check, not copied blindly.
split: train
kind: mastg
base: data/raw/mastg/demos/android
demos:
  - id: "0007"
    dir: MASVS-CRYPTO/MASTG-DEMO-0007
    files: {org/owasp/mastestapp/MastgTest.java: MastgTest_reversed.java}
    findings:
      - {file: org/owasp/mastestapp/MastgTest.java, vuln_class: weak_crypto, line_range: [22, 23], severity: low, cwe: CWE-330, evidence: 'new Random().nextDouble() and Math.random()'}
      - {file: org/owasp/mastestapp/MastgTest.java, vuln_class: weak_crypto, line_range: [24, 27], severity: medium, cwe: CWE-330, evidence: 'password characters chosen with java.util.Random', why: 'java.util.Random is a predictable PRNG, so a generated password can be reproduced from its seed or a few outputs.', fix: 'Generate passwords and tokens with java.security.SecureRandom.'}
