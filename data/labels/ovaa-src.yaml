  - {file: oversecured/ovaa/OversecuredApplication.java, line_range: [24, 54], reason: code loading from /sdcard and other packages}
  - {file: oversecured/ovaa/activities/LoginActivity.java, line_range: [58, 75], reason: credentials logged}
  - {file: oversecured/ovaa/activities/MainActivity.java, line_range: [63, 71], reason: trusts content URI returned by picker}
