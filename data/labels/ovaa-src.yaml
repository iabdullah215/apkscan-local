  - {file: oversecured/ovaa/utils/LoginUtils.java, vuln_class: insecure_storage, line_range: [38, 40], severity: high, evidence: 'putString(PASSWORD_KEY, loginData.password) into plain SharedPreferences'}
  - {file: oversecured/ovaa/utils/FileUtils.java, vuln_class: insecure_storage, line_range: [28, 31], severity: low, evidence: 'copies picked content to getExternalCacheDir()'}
ignore:
