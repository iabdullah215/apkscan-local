# Ground truth for OVAA in SOURCE form (test_src split): same app as labels/ovaa.yaml, read from
# GitHub source at commit e5d5a8ba (app/src/main), all 21 files read. Same findings and ignore
# regions as the jadx test set, at source line numbers. Used to compare source vs decompiled input.
app: ovaa-src
split: test_src
findings:
  - {file: AndroidManifest.xml, vuln_class: exported_component, line_range: [21, 26], severity: medium, evidence: 'LoginActivity exported="true" with no permission'}
  - {file: AndroidManifest.xml, vuln_class: exported_component, line_range: [33, 38], severity: medium, evidence: 'MainActivity exported="true" with no permission'}
  - {file: AndroidManifest.xml, vuln_class: exported_component, line_range: [45, 49], severity: high, evidence: 'InsecureLoggerService exported="true" with no permission'}
  - {file: AndroidManifest.xml, vuln_class: exported_component, line_range: [50, 50], severity: high, evidence: 'TheftOverwriteProvider exported="true" with no permission'}
  - {file: oversecured/ovaa/activities/LoginActivity.java, vuln_class: intent_redirection, line_range: [77, 80], severity: high, evidence: 'startActivity(getParcelableExtra(getIntent(), "redirect_intent"))'}
  - {file: oversecured/ovaa/activities/DeeplinkActivity.java, vuln_class: intent_redirection, line_range: [35, 39], severity: high, evidence: 'loginUtils.setLoginUrl(uri.getQueryParameter("url")) from a browsable deep link'}
