  - {file: AndroidManifest.xml, vuln_class: exported_component, line_range: [27, 31], severity: high, evidence: 'MyBroadCastReceiver exported="true", no permission'}
  - {file: AndroidManifest.xml, vuln_class: exported_component, line_range: [32, 32], severity: high, evidence: 'ChangePassword exported="true", no permission'}
