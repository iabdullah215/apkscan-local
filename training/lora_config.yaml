# MLX-LM LoRA config for apkscan-local v1 (Apple M4, 16 GB).
model: models/base/Qwen2.5-Coder-1.5B-Instruct
train: true
data: data/processed
fine_tune_type: lora
optimizer: adamw
mask_prompt: true          # loss only on the assistant JSON
num_layers: 16             # LoRA on the last 16 of 28 blocks
batch_size: 2
grad_accumulation_steps: 2 # effective batch 4
iters: 450                 # about 2 epochs over ~900 records
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 450, 1.0e-6]
max_seq_length: 3072
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 75
val_batches: 20
save_every: 150
adapter_path: models/adapters/v1
seed: 0
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
  rank: 16
  scale: 2.0
  dropout: 0.05
